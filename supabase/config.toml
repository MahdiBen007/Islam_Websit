# Supabase project configuration (version-controlled reference)
project_id = "creativity-innovation-club"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://creativity-club.netlify.app"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://127.0.0.1:4173/**", "http://localhost:5173/**"]
enable_signup = false

[functions.submit-registration]
verify_jwt = false
